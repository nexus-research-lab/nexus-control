openapi: 3.1.0
info:
  title: Nexus Control API
  version: 1.0.0
  description: 单 Deployment Control 首版合同。/auth/v1 供 Nexus Web 同源访问；internal 路由只供受信下游服务调用。
servers:
  - url: /
paths:
  /auth/v1/register:
    post:
      operationId: registerAccount
      description: 需要同源 Origin 且 CONTROL_REGISTRATION_ENABLED=true；创建无组织的普通平台账号并登录。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebLoginInput"}
      responses:
        "200": {$ref: "#/components/responses/Success"}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /auth/v1/organization/{action}:
    post:
      operationId: mutateOrganization
      security: [{CookieSession: []}]
      description: 同源 Origin。无组织可 create；owner/admin 可 rename；非 owner 可 leave；仅 owner 可 transfer/dissolve。组织操作不修改平台角色、账号或本地数据。返回最新认证状态。
      parameters:
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [create, rename, leave, transfer, dissolve]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 128, description: create/rename 必填}
                target_user_id: {type: string, minLength: 1, maxLength: 128, description: transfer 必填，同组织有效成员}
      responses:
        "200": {$ref: "#/components/responses/Success"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /auth/v1/nodes:
    get:
      operationId: listExecutionNodes
      security: [{CookieSession: []}]
      description: 当前组织与真人的最近 100 条 Node 授权，不返回凭据。
      responses:
        "200": {$ref: "#/components/responses/Success"}
        "401": {$ref: "#/components/responses/Error"}
    post:
      operationId: registerExecutionNode
      security: [{CookieSession: []}]
      description: 必须同源 Origin；节点绑定当前浏览器 Session 和明确选择的本人 Agent。相同 ID、凭据、名称和范围幂等，不允许覆盖或复活已撤销授权。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [node_id, name, credential, agent_ids]
              properties:
                node_id: {type: string, minLength: 1, maxLength: 128}
                name: {type: string, minLength: 1, maxLength: 128}
                credential: {type: string, description: 宿主生成的 32 字节随机 base64url 字符串，Control 只保存哈希。}
                agent_ids:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items: {type: string, maxLength: 128}
      responses:
        "200": {$ref: "#/components/responses/Success"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /auth/v1/nodes/{node_id}:
    get:
      operationId: getExecutionNode
      security: [{CookieSession: []}]
      description: 当前部署、组织和所有者限定的精确 Node 授权回执，含撤销状态，不返回凭据；不受最近 100 条列表窗口影响。登记状态不表示执行器已连接或父 Session 仍有效。
      parameters:
        - name: node_id
          in: path
          required: true
          schema: {type: string, maxLength: 128}
      responses:
        "200": {$ref: "#/components/responses/Success"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      operationId: revokeExecutionNode
      security: [{CookieSession: []}]
      description: 同源、所有者限定、幂等撤销；已注册节点同事务追加 session_revoked，目标为 node:<node_id>。未注册 ID 留不可换取令牌的终止记录，阻断迟到注册；不以 404 代替取消回执。
      parameters:
        - name: node_id
          in: path
          required: true
          schema: {type: string, maxLength: 128}
      responses:
        "200": {$ref: "#/components/responses/Success"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /auth/v1/nodes/token:
    post:
      operationId: exchangeExecutionNodeToken
      security: [{NodeCredential: []}]
      description: 不使用 Cookie。返回 data.token、expires_at 和已校验归属的 agents；令牌固定 nexus-relay-node audience、60 秒期限和签名 Agent 范围。父 Session 失效或 Agent 不再属于本人时拒绝。
      responses:
        "200": {$ref: "#/components/responses/Success"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/control/v1/internal/members/manage:
    post:
      operationId: manageMembersForBoundHuman
      description: 宿主服务凭据及有效真人 Session 双重校验；部署和角色从 Session 推导。remove 撤销部署访问并保留数据，update/remove 必须提供 inspect 返回的 updated_at Unix 微秒版本。
      security:
        - ServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actor_user_id, session_id, operation]
              properties:
                actor_user_id: {type: string}
                session_id: {type: string}
                operation: {type: string, enum: [list, create, update, remove]}
                target: {type: string}
                expected_version: {type: integer, format: int64}
                input:
                  oneOf:
                    - {$ref: "#/components/schemas/CreateMemberInput"}
                    - {$ref: "#/components/schemas/UpdateMemberInput"}
                    - {type: "null"}
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /auth/v1/status:
    get:
      operationId: webAuthStatus
      description: role 为平台角色，organization_role 为组织角色，二者不可互相替代。无组织的有效账号仍 authenticated=true；registration_enabled 表示是否开放普通账号注册。
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /auth/v1/login:
    post:
      operationId: webLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebLoginInput"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Error"
  /auth/v1/logout:
    post:
      operationId: webLogout
      security:
        - CookieSession: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "403":
          $ref: "#/components/responses/Error"
  /auth/v1/setup:
    post:
      operationId: webSetup
      security:
        - SetupToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupOwnerInput"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /auth/v1/profile:
    patch:
      operationId: webUpdateProfile
      security:
        - CookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /auth/v1/profile/password:
    post:
      operationId: webChangePassword
      security:
        - CookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /auth/v1/profile/password/receipt:
    get:
      operationId: webPasswordReceipt
      security:
        - CookieSession: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /auth/v1/profile/password/receipt/not-applied:
    post:
      operationId: webSettlePasswordNotApplied
      security:
        - CookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordReceiptInput"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /auth/v1/members:
    get:
      operationId: listOrganizationMembers
      description: 组织内所有有效成员可读，写入只允许组织 owner/admin；不要求平台管理员。
      security:
        - CookieSession: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createOrganizationMemberDirectly
      security:
        - CookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberInput"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /auth/v1/directory/members:
    get:
      operationId: listMemberDirectory
      description: 返回当前登录用户所在 Organization 的 active 真人目录，不包含角色、状态或登录时间。
      security:
        - CookieSession: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Error"
  /auth/v1/agents:
    get:
      operationId: listOwnedAgents
      description: 返回当前真人在当前 Organization 已发布的 active Agent 身份。
      security:
        - CookieSession: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Error"
  /auth/v1/directory/agents:
    get:
      operationId: listOrganizationAgentDirectory
      description: 返回当前 Organization 的 active Agent 公开身份，不暴露其他真人的本地 source_agent_id。
      security:
        - CookieSession: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Error"
  /auth/v1/agents/{source_agent_id}:
    put:
      operationId: publishOwnedAgent
      description: 以本地 source_agent_id 幂等创建或刷新当前真人拥有的在线 Agent 身份。
      security:
        - CookieSession: []
      parameters:
        - name: source_agent_id
          in: path
          required: true
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishAgentInput"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /auth/v1/members/{user_id}:
    patch:
      operationId: updateOrganizationMember
      security:
        - CookieSession: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberInput"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /auth/v1/organization/invitations:
    get:
      operationId: listOrganizationInvitations
      security:
        - CookieSession: []
      responses:
        "200": {$ref: "#/components/responses/Success"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createOrganizationInvitation
      security:
        - CookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateOrganizationInvitationInput"}
      responses:
        "200": {$ref: "#/components/responses/Success"}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /auth/v1/organization/invitations/{invitation_id}:
    delete:
      operationId: revokeOrganizationInvitation
      security:
        - CookieSession: []
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {$ref: "#/components/responses/Success"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /auth/v1/organization/invitations/{invitation_id}/record:
    delete:
      operationId: deleteOrganizationInvitation
      description: Delete accepted, revoked or expired invitation records only. Does not change organization membership. Owners may delete all records; admins may delete member-role records only.
      security:
        - CookieSession: []
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {$ref: "#/components/responses/Success"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /auth/v1/organization-invitations/{token}:
    get:
      operationId: previewOrganizationInvitation
      parameters:
        - {$ref: "#/components/parameters/InvitationToken"}
      responses:
        "200": {$ref: "#/components/responses/Success"}
        "404": {$ref: "#/components/responses/Error"}
  /auth/v1/organization-invitations/{token}/accept:
    post:
      operationId: acceptOrganizationInvitation
      description: 同源 Origin。未登录提交账号资料注册加入；已登录提交空对象并加入，必须当前无组织，不重设账号密码。邀请单次消费。
      parameters:
        - {$ref: "#/components/parameters/InvitationToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: "#/components/schemas/AcceptOrganizationInvitationInput"}
                - {type: object, maxProperties: 0}
      responses:
        "200": {$ref: "#/components/responses/Success"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /auth/v1/subscription/overview:
    get:
      operationId: subscriptionOverview
      security:
        - CookieSession: []
      responses:
        "200":
          description: 当前 Deployment 的套餐目录与成员有效额度。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SubscriptionOverview"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /auth/v1/subscription/plans:
    post:
      operationId: createSubscriptionPlan
      security:
        - CookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/UpsertSubscriptionPlanInput"
                - required: [plan_key]
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /auth/v1/subscription/plans/{plan_key}:
    put:
      operationId: updateSubscriptionPlan
      security:
        - CookieSession: []
      parameters:
        - $ref: "#/components/parameters/PlanKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertSubscriptionPlanInput"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /auth/v1/subscription/users/{user_id}:
    put:
      operationId: updateMemberEntitlement
      security:
        - CookieSession: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberEntitlementInput"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/control/v1/health:
    get:
      operationId: controlHealth
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/control/v1/.well-known/principal-key:
    get:
      operationId: controlPrincipalKey
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/control/v1/setup/owner:
    post:
      operationId: setupOwner
      security:
        - SetupToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupOwnerInput"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/control/v1/internal/state:
    get:
      operationId: internalState
      x-internal: true
      security:
        - ServiceToken: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/control/v1/internal/principals/exchange:
    post:
      operationId: exchangePrincipal
      x-internal: true
      security:
        - ServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_token, audience]
              properties:
                session_token:
                  type: string
                audience:
                  type: string
                  description: 配置的 Runtime audience，或固定的 nexus-relay-user。
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/control/v1/internal/identity-invalidations/latest:
    get:
      operationId: latestIdentityInvalidation
      x-internal: true
      security:
        - ServiceToken: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/control/v1/internal/identity-invalidations:
    get:
      operationId: listIdentityInvalidations
      x-internal: true
      security:
        - ServiceToken: []
      parameters:
        - in: query
          name: after
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 256
            default: 256
      responses:
        "200":
          description: 有序身份失效事件；next_cursor 等于最后一个 event_id。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [events, next_cursor]
                        properties:
                          events:
                            type: array
                            items:
                              $ref: "#/components/schemas/IdentityInvalidation"
                          next_cursor:
                            type: integer
                            format: int64
        "400":
          $ref: "#/components/responses/Error"
  /api/control/v1/internal/humans/verify:
    post:
      operationId: verifyInteractiveHuman
      x-internal: true
      security:
        - ServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id, session_id, audience]
              properties:
                user_id:
                  type: string
                session_id:
                  type: string
                audience:
                  type: string
                  description: 配置的 Runtime audience，或固定的 nexus-relay-user。
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Error"
  /api/control/v1/internal/organizations/members/verify:
    post:
      operationId: verifyOrganizationMembers
      description: 供受信 Nexus Gateway 在建群前确认所有真人目标都属于指定 Deployment 下的同一 active Organization。
      x-internal: true
      security:
        - ServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deployment_id, organization_id, user_ids]
              properties:
                deployment_id: {type: string}
                organization_id: {type: string}
                user_ids:
                  type: array
                  maxItems: 100
                  items: {type: string}
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "403":
          $ref: "#/components/responses/Error"
  /api/control/v1/internal/agents/verify:
    post:
      operationId: verifyOwnedAgents
      description: 供受信 Nexus Gateway 验证一组 active Agent 均属于指定组织和真人，并返回可投影到 Relay 的公开身份。
      x-internal: true
      security:
        - ServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deployment_id, organization_id, owner_user_id, agent_ids]
              properties:
                deployment_id: {type: string}
                organization_id: {type: string}
                owner_user_id: {type: string}
                agent_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: {type: string}
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "403":
          $ref: "#/components/responses/Error"
  /api/control/v1/internal/users/{user_id}/role:
    get:
      operationId: internalUserRole
      x-internal: true
      security:
        - ServiceToken: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/control/v1/internal/deployments/{deployment_id}/users/{user_id}/entitlement:
    get:
      operationId: internalEffectiveEntitlement
      x-internal: true
      security:
        - ServiceToken: []
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Nexus 本地运行时投影所需的有效额度。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Entitlement"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    NodeCredential:
      type: http
      scheme: bearer
      description: 注册时由设备安全保存的独立随机凭据，不是浏览器 Session 或服务 token。
    ServiceToken:
      type: http
      scheme: bearer
    SetupToken:
      type: http
      scheme: bearer
    CookieSession:
      type: apiKey
      in: cookie
      name: nexus_session
  parameters:
    InvitationToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 64
        maxLength: 64
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
    PlanKey:
      name: plan_key
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
    RequestID:
      name: request_id
      in: query
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    PublishAgentInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        source_agent_id: {type: string, maxLength: 128}
        name: {type: string, minLength: 1, maxLength: 128}
        avatar: {type: string, maxLength: 2048}
    Agent:
      type: object
      required: [agent_id, owner_user_id, source_agent_id, name, status, created_at, updated_at]
      properties:
        agent_id: {type: string}
        owner_user_id: {type: string}
        source_agent_id: {type: string}
        name: {type: string}
        avatar: {type: string}
        status: {type: string, enum: [active, revoked]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AgentDirectoryEntry:
      type: object
      required: [agent_id, owner_user_id, name]
      properties:
        agent_id: {type: string}
        owner_user_id: {type: string}
        name: {type: string}
        avatar: {type: string}
    SetupOwnerInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        display_name:
          type: string
        password:
          type: string
          minLength: 8
        deployment_name:
          type: string
          maxLength: 128
        organization_name:
          type: string
          maxLength: 128
    WebLoginInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 1024
    UpdateProfileInput:
      type: object
      additionalProperties: false
      required: [avatar]
      properties:
        avatar:
          type: string
          maxLength: 255
    PasswordReceiptInput:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id:
          type: string
          minLength: 8
          maxLength: 128
    CreateMemberInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        display_name:
          type: string
          maxLength: 128
        password:
          type: string
          minLength: 8
          maxLength: 1024
        role:
          type: string
          enum: [admin, member]
          default: member
    CreateOrganizationInvitationInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]
        expires_in_hours:
          type: integer
          minimum: 1
          maximum: 720
          default: 168
    AcceptOrganizationInvitationInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 64}
        display_name: {type: string, maxLength: 128}
        password: {type: string, minLength: 8, maxLength: 1024}
    UpdateMemberInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: {type: string, minLength: 1, maxLength: 128}
        expected_version: {type: integer, format: int64}
        role:
          type: string
          enum: [admin, member]
        status:
          type: string
          enum: [revoked]
    DeploymentMember:
      type: object
      required: [deployment_id, user_id, username, display_name, role, membership_status, created_at, updated_at]
      properties:
        deployment_id:
          type: string
        user_id:
          type: string
        username:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [owner, admin, member]
        membership_status:
          type: string
          enum: [active, revoked]
        avatar:
          type: string
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MemberDirectoryEntry:
      type: object
      required: [user_id, username, display_name]
      properties:
        user_id:
          type: string
        username:
          type: string
        display_name:
          type: string
        avatar:
          type: string
    Entitlement:
      type: object
      required: [plan_key, plan_name, monthly_token_limit, updated_at]
      properties:
        plan_key:
          type: string
        plan_name:
          type: string
        monthly_token_limit:
          anyOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
        updated_at:
          type: string
          format: date-time
    SubscriptionPlan:
      type: object
      required: [plan_key, display_name, status, monthly_token_limit, notes, sort_order]
      properties:
        plan_key:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [active, archived]
        monthly_token_limit:
          anyOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
        notes:
          type: string
        sort_order:
          type: integer
    SubscriptionAccount:
      type: object
      required: [user_id, username, display_name, role, user_status, plan_key, plan_name, monthly_token_limit, created_at, updated_at]
      properties:
        user_id:
          type: string
        username:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [owner, admin, member]
        user_status:
          type: string
          enum: [active, revoked]
        plan_key:
          type: string
        plan_name:
          type: string
        monthly_token_limit:
          anyOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
        avatar:
          type: string
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SubscriptionOverview:
      type: object
      required: [plans, accounts, updated_at]
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionPlan"
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionAccount"
        updated_at:
          type: string
          format: date-time
    UpsertSubscriptionPlanInput:
      type: object
      additionalProperties: false
      required: [display_name, monthly_token_limit]
      properties:
        plan_key:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: string
          enum: [active, archived]
          default: active
        monthly_token_limit:
          anyOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
        notes:
          type: string
          maxLength: 4096
        sort_order:
          type: integer
          default: 100
    UpdateMemberEntitlementInput:
      type: object
      additionalProperties: false
      required: [plan_key]
      properties:
        plan_key:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
    ChangePasswordInput:
      type: object
      additionalProperties: false
      required: [request_id, current_password, new_password]
      properties:
        request_id:
          type: string
          minLength: 8
          maxLength: 128
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
    IdentityInvalidation:
      type: object
      required: [event_id, deployment_id, user_id, reason, created_at]
      properties:
        organization_id:
          type: string
          description: 组织成员撤权的精确作用域。
        membership_revoked:
          type: boolean
          description: 已提交的组织撤权事实；Relay 必须与消费游标同事务处理，不得仅看当前成员状态推断历史。
        event_id:
          type: integer
          format: int64
        deployment_id:
          type: string
        user_id:
          type: string
        session_id:
          type: string
          description: 仅 session_revoked 事件携带；普通值撤销浏览器 Session 及其派生 Node，node:<node_id> 只撤销精确 Node。
        reason:
          type: string
          enum: [principal_changed, profile_changed, session_revoked, entitlement_changed, organization_changed]
        created_at:
          type: string
          format: date-time
    Envelope:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        data: {}
        details:
          type: object
          additionalProperties: true
  responses:
    Success:
      description: 请求成功，业务载荷位于 data。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Error:
      description: 请求失败。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
